listen:
  port: 8096

cachedir: /var/tmp/rcfin-img-cache
database:
  sqlite:
    filename: /usr/local/rcfin/db/rcfin.db


jellyfin:
  servername: RCFin
  autoregister: yes
  imagequalityposter: 40

collections:
  - name: Movies
    type: movies
    directory: /media/movies
  - name: TV Shows
    type: shows
    directory: /media/tv-series
