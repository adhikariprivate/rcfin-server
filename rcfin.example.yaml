# RCFin configuration. Copy to rcfin.yaml, edit the paths and remote names,
# then start with: ./rcfin --config rcfin.yaml

listen:
  # HTTP port. Address can be set to bind a specific interface (for example,
  # 127.0.0.1). Leave address empty to use the server's default interface.
  address: ""
  port: "8096"
  # Optional TLS. Set both values to enable HTTPS.
  tls_cert: ""
  tls_key: ""
  # Optional comma-separated client IP allow list; empty allows all clients.
  ip_acl: ""

# Logs go to the process stdout by default. Other values: stderr, none, or a
# writable file path such as /var/log/rcfin/rcfin.log.
logfile: stdout

# These paths must be writable by the account running RCFin. They are local;
# media itself is read from the configured Rclone remotes below.
cachedir: /var/cache/rcfin/images
rescan_interval: 30m

database:
  sqlite:
    filename: /var/lib/rcfin/rcfin.db

# This is the full path to the Rclone INI config file, including its filename.
# It is not the directory containing that file. The file should define every
# named remote used below (for example a [files] section for files:Movies).
rclone:
  config: /etc/rcfin/rclone.conf
  cache_dir: /var/cache/rcfin/rclone

jellyfin:
  server_id: "" # Optional stable server ID; empty lets RCFin generate one.
  server_name: RCFin
  quick_connect: false
  image_quality_poster: 40

collections:
  - id: movies # Required stable ID used by account library grants; keep it unchanged.
    name: Movies
    type: movies # Supported values: movies, shows.
    # Must be a configured Rclone remote followed by a colon and remote path.
    # The remote name must match a section in rclone.config above.
    remote: files:HTPC/Movies
    vfs:
      dir_cache_time: 30m
      poll_interval: 0s
      read_only: true
      vfs_cache_mode: full
      vfs_cache_max_size: 20GiB
      vfs_cache_max_age: 24h
      vfs_read_chunk_size: 32M
      vfs_read_chunk_size_limit: 256M
      vfs_handle_caching: 1m

  - id: shows
    name: TV Shows
    type: shows
    remote: files:HTPC/TV
    vfs:
      dir_cache_time: 30m
      poll_interval: 0s
      read_only: true
      vfs_cache_mode: full
      vfs_cache_max_size: 20GiB
      vfs_cache_max_age: 24h
      vfs_read_chunk_size: 32M
      vfs_read_chunk_size_limit: 256M
      vfs_handle_caching: 1m
