# RCFin configuration. Copy to rcfin.yaml, edit the paths and remote names,
# then start with: ./rcfin --config rcfin.yaml

listen:
  # HTTP port. Address can be set to bind a specific interface (for example,
  # 127.0.0.1). Leave address empty to use the server's default interface.
  address: ""
  port: "8096"
  # Optional TLS. Set both values to enable HTTPS.
  tls_cert: ""
  tls_key: ""
  # Optional comma-separated client IP allow list; empty allows all clients.
  ip_acl: ""
  # Optional private listener inside Tailscale. Its requests bypass ip_acl.
  tailscale:
    enabled: false
    hostname: handler
    state_dir: /var/lib/rcfin/tsnet
    # Name of the environment variable holding the Tailscale/Headscale auth key.
    auth_key_env: RCFIN_TAILSCALE_AUTH_KEY
    # Leave empty for Tailscale; set to e.g. https://headscale.example.com for Headscale.
    control_url: ""
    # Separate private listener port. HTTPS on 443 avoids a port suffix in client URLs.
    port: "443"
    # Uses Tailscale-managed HTTPS certificates when enabled.
    https: true

# Logs go to the process stdout by default. Other values: stderr, none, or a
# writable file path such as /var/log/rcfin/rcfin.log.
logfile: stdout

# These paths must be writable by the account running RCFin. They are local;
# media itself is read from the configured Rclone remotes below.
cachedir: /var/cache/rcfin/images
scan_interval: 30m # Default cadence for the complete per-library pipeline.
# Legacy alias for scan_interval. Prefer scan_interval in new configurations.
rescan_interval: ""

database:
  # Supported drivers: sqlite (default) and postgres.
  driver: sqlite
  sqlite:
    filename: /var/lib/rcfin/rcfin.db
  # For PostgreSQL, set driver: postgres and provide url here or through
  # RCFIN_POSTGRES_URL. Prefer the environment variable for credentials.
  postgres:
    url: ""

# This is the full path to the Rclone INI config file, including its filename.
# It is not the directory containing that file. The file should define every
# named remote used below (for example a [files] section for files:Movies).
rclone:
  config: /etc/rcfin/rclone.conf
  cache_dir: /var/cache/rcfin/rclone

jellyfin:
  server_id: "" # Optional stable server ID; empty lets RCFin generate one.
  server_name: RCFin
  quick_connect: false
  image_quality_poster: 40

# Optional read-only virtual WebDAV view. All configured views, NFO files, and
# artwork are visible to every user who has access to the corresponding library.
webdav:
  enabled: true
  path: /dav/
  cache:
    directory_ttl: 5m

collections:
  - id: movies # Required stable ID used by account library grants; keep it unchanged.
    name: Movies
    type: movies # Supported values: movies, shows.
    # Must be a configured Rclone remote followed by a colon and remote path.
    # The remote name must match a section in rclone.config above.
    remote: files:HTPC/Movies
    media:
      scan_interval: 30m # One inventory cadence for Inbox, metadata, and subtitles.
      missing_grace: 168h # Ignore a disappeared path until it stays absent this long.
      # Explicit relative intake path. It is excluded from the playable scan.
      inbox_path: .Inbox
      inbox:
        stable_for: 10m
        # Optional; set only when the uploader creates this after all files finish.
        completion_marker: ""
      # Shared concurrency limit across metadata, subtitles, and organization.
      # Zero or omission defaults to one; accepted range is 0..32.
      max_parallel_jobs: 1
      # Existing-path migration is independent from Inbox organization and is
      # disabled by default. Review the dry-run report before setting dry_run: false.
      normalize_existing:
        enabled: false
        dry_run: true
      organize:
        enabled: false
        dry_run: true
        # Opaque DVD/Blu-ray movie folders may be moved only when explicitly enabled.
        disc_folders: false
        preserve_grouping_directories: true
        conflict_policy: skip
        allow_cross_backend_copy_delete: false
        include_provider_id: true
        minimum_confidence: 0.88
        folder_format: "{title} ({year}) [tmdbid-{tmdb_id}]"
        file_format: "{folder} [{quality}-{resolution}]{version} [{edition}] [{release_group}].{ext}"
        episode_fallback_languages: [en]
        allowed_extensions: [mkv, mp4, m4v, m4u, mov, avi, divx, webm, mpg, mpeg, mpe, mpeg2, m1v, m2v, ts, mts, m2ts, vob, wmv, flv, ogv, ogm, 3gp, 3g2]
        stable_for: 10m
        completion_marker: .rcfin-complete
      metadata:
        enabled: false
        provider: tmdb
        api_key_env: RCFIN_TMDB_API_KEY
        language: en-US
        fallback_languages: [en]
        artwork_max_bytes: 12582912
        artwork_max_width: 5000
        artwork_max_height: 5000
        artwork_formats: [jpeg, png]
        artwork_poster_size: w500
        artwork_backdrop_size: w780
        request_timeout: 10s
        retry_limit: 3
        fetch_artwork: true
        fetch_nfo: true
        overwrite_existing: false
        overwrite_artwork: false
        minimum_confidence: 0.80
        refresh_existing_after: 2160h
      subtitles:
        enabled: false
        provider: opensubtitles
        api_key_env: RCFIN_OPENSUBTITLES_API_KEY
        username_env: RCFIN_OPENSUBTITLES_USERNAME
        password_env: RCFIN_OPENSUBTITLES_PASSWORD
        languages: [en]
        hearing_impaired: false
        forced: false
        formats: [srt]
        overwrite_existing: false
        minimum_confidence: 0.84
        request_timeout: 15s
        retry_limit: 3
        max_download_bytes: 20971520
    vfs:
      no_modtime: false
      no_checksum: false
      no_seek: false
      dir_cache_time: 30m
      vfs_refresh: false
      poll_interval: 0s
      read_only: true
      vfs_links: false
      vfs_cache_mode: full
      vfs_cache_poll_interval: 1m
      vfs_cache_max_size: 20GiB
      vfs_cache_max_age: 24h
      vfs_cache_min_free_space: "off"
      vfs_read_chunk_size: 32M
      vfs_read_chunk_size_limit: 256M
      vfs_read_chunk_streams: 0
      dir_perms: "0777"
      file_perms: "0666"
      link_perms: "0777"
      vfs_case_insensitive: false
      vfs_block_norm_dupes: false
      vfs_write_wait: 1s
      vfs_read_wait: 20ms
      vfs_write_back: 5s
      vfs_read_ahead: 0
      vfs_used_is_size: false
      vfs_fast_fingerprint: false
      vfs_disk_space_total_size: "off"
      umask: "0022"
      uid: 0
      gid: 0
      vfs_handle_caching: 1m
      vfs_metadata_extension: ""
    webdav:
      enabled: true
      views: [all, genres, actors, directors, years, studios]
      labels:
        all: All
        genres: Genres
        actors: Actors
        directors: Directors
        years: Years
        studios: Studios
      file_name: "{title} ({year}).{ext}"
      title_folder: "{title} ({year})"
      nfo: true
      artwork: true

  - id: shows
    name: TV Shows
    type: shows
    remote: files:HTPC/TV
    media:
      scan_interval: 30m
      inbox_path: .Inbox
      inbox:
        stable_for: 10m
      max_parallel_jobs: 1
      normalize_existing:
        enabled: false
        dry_run: true
      organize:
        enabled: false
        dry_run: true
        disc_folders: false
        preserve_grouping_directories: true
        conflict_policy: skip
        allow_cross_backend_copy_delete: false
        include_provider_id: true
        minimum_confidence: 0.88
        series_format: "{title} ({year}) [tmdbid-{tmdb_id}]"
        season_format: "Season {season}"
        episode_format: "{series} - {episode} - {episode_title} [{quality}-{resolution}]{version} [{edition}] [{release_group}].{ext}"
        episode_fallback_languages: [en]
        allowed_extensions: [mkv, mp4, m4v, m4u, mov, avi, divx, webm, mpg, mpeg, mpe, mpeg2, m1v, m2v, ts, mts, m2ts, vob, wmv, flv, ogv, ogm, 3gp, 3g2]
      metadata:
        enabled: false
        provider: tmdb
        api_key_env: RCFIN_TMDB_API_KEY
        language: en-US
        fallback_languages: [en]
        artwork_max_bytes: 12582912
        artwork_max_width: 5000
        artwork_max_height: 5000
        artwork_formats: [jpeg, png]
        artwork_poster_size: w500
        artwork_backdrop_size: w780
        request_timeout: 10s
        retry_limit: 3
        fetch_artwork: true
        fetch_nfo: true
        overwrite_existing: false
        overwrite_artwork: false
      subtitles:
        enabled: false
        provider: opensubtitles
        api_key_env: RCFIN_OPENSUBTITLES_API_KEY
        username_env: RCFIN_OPENSUBTITLES_USERNAME
        password_env: RCFIN_OPENSUBTITLES_PASSWORD
        languages: [en]
        hearing_impaired: false
        forced: false
        formats: [srt]
        overwrite_existing: false
        minimum_confidence: 0.84
        request_timeout: 15s
        retry_limit: 3
        max_download_bytes: 20971520
    vfs:
      dir_cache_time: 30m
      poll_interval: 0s
      read_only: true
      vfs_cache_mode: full
      vfs_cache_max_size: 20GiB
      vfs_cache_max_age: 24h
      vfs_read_chunk_size: 32M
      vfs_read_chunk_size_limit: 256M
      vfs_handle_caching: 1m
    webdav:
      enabled: true
      views: [all, genres, actors, directors, years, studios]
      episode_file_name: "{series} - S{season:02}E{episode:02} - {episode_title}.{ext}"
      nfo: true
      artwork: true
