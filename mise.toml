[tools]
go = "1.26.0"

[tasks.build]
description = "Build the RCFin server"
run = "mkdir -p bin && go build -o bin/rcfin ."

[tasks.test]
description = "Run the Go test suite"
run = "go test ./..."

[tasks.run]
description = "Run RCFin with the local configuration"
run = "go run . --config rcfin.yaml"
