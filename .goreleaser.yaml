version: 2
project_name: rcfin

builds:
  - id: rcfin
    main: ./cmd/rcfin-server
    binary: rcfin
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    goos:
      - linux
      - windows
      - freebsd
      - openbsd
      - netbsd
    goarch:
      - 386
      - amd64
      - arm
      - arm64
    goarm:
      - 6
      - 7
    ignore:
      - goos: windows
        goarch: arm
      - goos: openbsd
        goarch: 386
      - goos: openbsd
        goarch: arm
      - goos: netbsd
        goarch: 386
      - goos: netbsd
        goarch: arm
      - goos: netbsd
        goarch: arm64

archives:
  - id: rcfin
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}
    files:
      - LICENSE
      - README.md
      - CONTRIBUTING.md
      - rcfin.example.yaml
      - docs/**

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^chore:'
      - '^ci:'
